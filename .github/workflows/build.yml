# Construit les trois éditions et les joint à une release quand on pousse un tag v*
name: Images Lucien OS
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      edition:
        description: "Édition à construire"
        type: choice
        options: [all, laptop, pc, pi5]
        default: all
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: pc,     runner: ubuntu-24.04 }
          - { edition: laptop, runner: ubuntu-24.04 }
          - { edition: pi5,    runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition }}
        uses: actions/checkout@v4
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition }}
        name: Libérer de la place
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition }}
        name: Construire ${{ matrix.edition }}
        run: sudo ./build/build.sh ${{ matrix.edition }}
      - if: ${{ github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition }}
        uses: actions/upload-artifact@v4
        with:
          name: lucien-os-${{ matrix.edition }}
          path: out/*
  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}
          name: Lucien OS 1.0
          prerelease: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
