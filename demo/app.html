<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Lucien</title>
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="css/lucien.css">
<link rel="stylesheet" href="css/office.css">
<link rel="stylesheet" href="css/office-apps.css">
<link rel="stylesheet" href="css/calc.css">
<link rel="stylesheet" href="css/code.css">
<style>
  /* une seule application en plein écran (utilisée par lucien-webapp sur le vrai système) */
  #desktop{background:var(--win-solid)!important}
  .win{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important;box-shadow:none!important}
  .win .tb,.win .rs{display:none}
</style>
</head>
<body>
<div id="desktop"><div id="wins"></div><div id="notifs"></div></div>
<div id="login" class="hidden"></div><div id="mbBat" hidden></div><div id="mbApp" hidden></div><div id="dock" hidden></div>
<script src="js/core.js"></script>
<script src="js/apps.js"></script>
<script src="js/settings.js"></script>
<script src="js/calc-engine.js"></script>
<script src="js/calculator.js"></script>
<script src="js/calc-graph.js"></script>
<script src="js/docx.js"></script>
<script src="js/office.js"></script>
<script src="js/office-texte.js"></script>
<script src="js/office-tableur.js"></script>
<script src="js/office-presentation.js"></script>
<script src="js/office-apps.js"></script>
<script src="js/office-apps2.js"></script>
<script src="js/code.js"></script>
<script>
  // ?app=calc | code | carnet | taches | formulaires | texte | tableur | presentation | office
  const id = new URLSearchParams(location.search).get("app") || "calc";
  function power() {}
  function tickClock() {}
  function ctxMenu(e, items) { e.preventDefault(); e.stopPropagation(); $$(".menu").forEach(m => m.remove()); const m = buildMenu(items); m.style.left = Math.min(e.clientX, innerWidth - 240) + "px"; m.style.top = Math.min(e.clientY, innerHeight - 300) + "px"; $("#desktop").append(m); }
  function buildMenu(items) { const m = h(`<div class="menu"></div>`); for (const it of items) { if (it === "-") { m.append(h("<hr>")); continue; } const [label, fn, o = {}] = it; const r = h(`<div class="mi ${o.dis ? "dis" : ""}">${o.ic ? svg(o.ic, 15) : ""}<span class="l">${esc(label)}</span>${o.kbd ? `<kbd>${o.kbd}</kbd>` : ""}</div>`); if (o.sub) { const s = buildMenu(o.sub); s.classList.add("sub"); r.append(s); } else if (!o.dis) r.onclick = (ev) => { ev.stopPropagation(); m.remove(); fn && fn(); }; m.append(r); } return m; }
  function closeMenus() { $$(".menu").forEach(m => m.remove()); }
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".menu")) closeMenus(); });
  function importFiles() {} function addRealFiles() {} function emptyTrash() {} function fileCtxItems() { return []; } function dirCtxItems() { return []; } function inlineRename() {}
  applyTheme(); document.title = APPS[id] ? APPS[id].name : "Lucien";
  const w = openApp(APPS[id] ? id : "calc");
</script>
</body>
</html>
